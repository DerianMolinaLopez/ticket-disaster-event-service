server:
    port: 8081

spring:
    application:
        name: event-service
    datasource:
        url: jdbc:postgresql://localhost:5432/events
        username: events_user
        password: events_pass
    flyway:
        # db/migration: esquema (V1__init.sql, V2__...). Va a todos los entornos.
        # db/seed: datos de ambientación SOLO para desarrollo. Quítalo en producción.
        locations:
            - classpath:db/migration
            - classpath:db/seed
    jpa:
        hibernate:
            # Flyway crea las tablas; Hibernate solo comprueba que coincidan con las entidades
            ddl-auto: validate
        open-in-view: false
